# Optional public HTTPS endpoint. Use together with compose.yaml and, in production,
# compose.production.yaml. MINI_APP_URL must be your domain's HTTPS origin.
services:
  bot:
    environment:
      MINI_APP_HOST: 0.0.0.0
      MINI_APP_PORT: "8080"
    ports:
      - "127.0.0.1:${MINI_APP_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MINI_APP_URL: ${MINI_APP_URL:?Set MINI_APP_URL in .local/.env to your HTTPS origin}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
